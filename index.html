<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>autotest テスト</title>
    <style>
        :root {
            color-scheme: only light;
            font-size: clamp(14px, 1.1vw + 12px, 18px);
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            padding: 3rem 1.5rem;
            font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
            background: #ffffff;
            color: #1f2937;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.9rem, 2.5vw + 1rem, 2.8rem);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #1f2937;
        }

        .message {
            margin: 0;
            line-height: 1.7;
            font-size: 1.05rem;
        }

        .updated {
            margin: 0;
            font-size: 0.95rem;
            color: #4b5563;
        }
    </style>
</head>
<body>
    <h1>GitHub Actions 自動デプロイ成功！</h1>
    <p class="message">ねるか</p>
    <p class="updated">最終更新: 2025年11月15日 08:40 (UTC)</p>
</body>
</html>
