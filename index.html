<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>autotest テスト</title>
    <style>
        :root {
            font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
            color-scheme: light dark;
            --bg: #f4f4f4;
            --card: #ffffff;
            --text: #1c1c1c;
            --muted: #7a7a7a;
            --border: #d4d4d4;
            --accent: #1c1c1c;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f0f0f;
                --card: #1a1a1a;
                --text: #f7f7f7;
                --muted: #9b9b9b;
                --border: #2b2b2b;
                --accent: #f7f7f7;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(2rem, 8vw, 4rem);
            background: var(--bg);
            color: var(--text);
        }

        main {
            width: min(520px, 100%);
            background: var(--card);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: clamp(2.4rem, 5vw, 3.2rem);
            display: grid;
            gap: clamp(1.6rem, 3vw, 2rem);
        }

        header {
            display: grid;
            gap: 0.8rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.78rem;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--muted);
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 2.6vw + 1.6rem, 2.6rem);
            line-height: 1.2;
            letter-spacing: 0.06em;
        }

        p {
            margin: 0;
            font-size: 1rem;
            line-height: 1.6;
            color: var(--muted);
        }

        .status {
            display: grid;
            gap: 1rem;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
            color: var(--muted);
        }

        .status-item strong {
            color: var(--text);
            font-size: 1.05rem;
            letter-spacing: 0.04em;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .actions a {
            text-decoration: none;
            padding: 0.75rem 1.6rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--accent);
            font-weight: 600;
            letter-spacing: 0.05em;
            transition: background 180ms ease, color 180ms ease;
        }

        .actions a:hover,
        .actions a:focus-visible {
            background: var(--accent);
            color: var(--card);
        }

        footer {
            font-size: 0.85rem;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main>
        <header>
            <span class="badge">DEPLOYMENT</span>
            <h1>レンタルサーバーに最新ビルドを公開しました</h1>
            <p>落ち着いたモノクロ基調でまとめた配信結果です。Windows の VSCode からでも管理しやすく、iPhone でのチェックにもぴったり。</p>
        </header>

        <section class="status" aria-label="deploy status">
            <div class="status-item">
                <span>最終デプロイ</span>
                <strong>2024-05-07 21:45</strong>
            </div>
            <div class="status-item">
                <span>稼働状態</span>
                <strong>安定稼働中</strong>
            </div>
            <div class="status-item">
                <span>テスト</span>
                <strong>レンタルサーバー上で確認済み</strong>
            </div>
        </section>

        <div class="actions">
            <a href="#">ログを確認</a>
            <a href="#">次のリリースを準備</a>
        </div>

        <footer>
            安心して次のタスクへ進めるよう、いつでもここから状況をチェックできます。
        </footer>
    </main>
</body>
</html>
