<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>autotest テスト</title>
    <style>
        :root {
            color-scheme: only light;
            font-size: clamp(14px, 1.1vw + 12px, 18px);
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            padding: 3rem 1.5rem;
            font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
            background: #000000;
            color: #f9fafb;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.9rem, 2.5vw + 1rem, 2.8rem);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #e5e7eb;
            text-align: center;
        }

        .message {
            margin: 0;
            line-height: 1.7;
            font-size: 1.05rem;
            text-align: center;
        }

        .updated {
            margin: 0;
            font-size: 0.95rem;
            color: #9ca3af;
        }

        .timestamp {
            display: block;
            margin-top: 0.35rem;
            font-size: 0.85rem;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <h1 data-with-timestamp="heading">GitHub Actions 自動デプロイ成功！</h1>
    <p class="message" data-with-timestamp="message">ねるか</p>
    <p class="updated" data-with-timestamp="updated">最終更新: 2025年11月15日 08:40 (UTC)</p>

    <script>
        (function () {
            const formatter = new Intl.DateTimeFormat("ja-JP", {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false,
                timeZone: "Asia/Tokyo"
            });

            const now = new Date();
            const formatted = formatter.format(now).replace(/\//g, "-");

            document.querySelectorAll("[data-with-timestamp]").forEach((element) => {
                const label = element.dataset.withTimestamp;
                const timestamp = document.createElement("span");
                timestamp.className = "timestamp";

                if (label === "heading") {
                    timestamp.textContent = `生成時刻 (JST): ${formatted}`;
                } else if (label === "message") {
                    timestamp.textContent = `メッセージ更新: ${formatted}`;
                } else {
                    timestamp.textContent = `タイムスタンプ: ${formatted}`;
                }

                element.appendChild(timestamp);
            });
        })();
    </script>
</body>
</html>
