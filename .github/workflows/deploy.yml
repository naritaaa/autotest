name: Deploy autotest to ShinServer

on:
  push:
    branches:
      - main   # ★codeX / VSCode から push しているブランチ名に合わせる（main ならこのままでOK）

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # リポジトリのコードを取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # SSH秘密鍵を書き出し
      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key
          chmod 600 key

      # 接続テスト（ログで確認用）
      - name: Test SSH connection
      # 失敗したらここで止まるので、成功してるならSSH設定はOK
        run: |
          ssh -i key \
            -o UserKnownHostsFile=/dev/null \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo Connected to $(hostname)"

      # デプロイ前にサーバー側のパスを表示（デバッグ用）
      - name: Show current files on server (before deploy)
        run: |
          ssh -i key \
            -o UserKnownHostsFile=/dev/null \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo '=== BEFORE ==='; ls -al ${{ secrets.DEPLOY_PATH }}"

      # autotest ディレクトリを rsync でデプロイ
      - name: Deploy autotest via rsync
        run: |
          rsync -auzrv \
            --exclude '.git' \
            --exclude '.github' \
            ./autotest/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/ \
            -e "ssh -i key -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }}"

      # デプロイ後の状態を確認（ログに反映されているかチェック）
      - name: Show current files on server (after deploy)
        run: |
          ssh -i key \
            -o UserKnownHostsFile=/dev/null \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo '=== AFTER ==='; ls -al ${{ secrets.DEPLOY_PATH }}"
