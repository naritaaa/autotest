name: Deploy to ShinServer

on:
  push:
    branches:
      - main   # ★codeX が push してるブランチ名に合わせる

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key
          chmod 600 key

      - name: Test SSH connection
        run: |
          ssh -v -i key \
            -o UserKnownHostsFile=/dev/null \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo Connected"

      - name: Deploy autotest via rsync
        run: |
          rsync -auzrv \
            --exclude '.git' \
            --exclude '.github' \
            ./autotest/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/ \
            -e "ssh -i key -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }}"
