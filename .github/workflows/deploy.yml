name: Deploy autotest to ShinServer

on:
  push:
    branches:
      - main  # へえ★codeX / VSCode から push しているブランチ名に合わせる


jobs:
  deploy:
    runs-on: ubuntu-latest

    # ここで secrets を環境変数にまとめておく
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      # リポジトリのコードを取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # SSH秘密鍵を書き出し
      - name: Setup SSH key
        run: |
          echo "$SSH_PRIVATE_KEY" > key
          chmod 600 key

      # 接続テスト（ここで成功すれば SSH 周りはOK）
      - name: Test SSH connection
        run: |
          ssh -i key \
            -o UserKnownHostsFile=/dev/null \
            -o StrictHostKeyChecking=no \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "echo 'Connected to ' \$(hostname)"

      # デプロイ前にサーバー側の状態を確認（ログ用）
      - name: Show current files on server (before deploy)
        run: |
          ssh -i key \
            -o UserKnownHostsFile=/dev/null \
            -o StrictHostKeyChecking=no \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "echo '=== BEFORE ==='; pwd; ls -al \"$DEPLOY_PATH\""

      # autotest ディレクトリを rsync でデプロイ
      - name: Deploy autotest via rsync
        run: |
          rsync -auzrv \
            --exclude '.git' \
            --exclude '.github' \
            ./autotest/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/" \
            -e "ssh -i key -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -p $SSH_PORT"

      # デプロイ後の状態を確認（ログで index.html が見えるかチェック）
      - name: Show current files on server (after deploy)
        run: |
          ssh -i key \
            -o UserKnownHostsFile=/dev/null \
            -o StrictHostKeyChecking=no \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "echo '=== AFTER ==='; ls -al \"$DEPLOY_PATH\""
